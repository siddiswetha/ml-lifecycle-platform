name: Extract project zip
on:
  workflow_dispatch:
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip into repo root
        run: |
          unzip -o ml-lifecycle-platform.zip
          cp -a ml-lifecycle-platform/. .
          rm -rf ml-lifecycle-platform ml-lifecycle-platform.zip .github/workflows/extract-zip.yml
          echo "FILE COUNT:"
          find . -path ./.git -prune -o -type f -print | sort | tee /tmp/files.txt
          wc -l /tmp/files.txt
      - name: Commit extracted files
        run: |
          git config user.name "siddiswetha"
          git config user.email "siddiswetha@users.noreply.github.com"
          git add -A
          git status --short

          git commit -m "Add ML Lifecycle Platform project files"
          git push
